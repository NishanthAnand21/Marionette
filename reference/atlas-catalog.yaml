# MITRE ATLAS technique catalog --- VERIFIED against primary source.
# Source: https://raw.githubusercontent.com/mitre-atlas/atlas-data/main/dist/v6/ATLAS-2026.07.yaml
#         (release manifest: dist/manifest.yaml -> release 2026.07, dated 2026-07-31)
# Retrieved: 2026-08-25   Format-version: 6.0.0   Collection version: 2026.07
#
# NOTE: dist/ATLAS.yaml in that repo is DEPRECATED (pinned at legacy 5.6.0) and is
# missing every agentic technique. Do not use it. dist/ATLAS-latest.yaml is a text
# pointer file containing the string "v6/ATLAS-latest.yaml", not data.
#
# Tactic assignment comes from the "achieves" relationships; sub-technique parentage
# from "specializes". Descriptions are the first sentence of the canonical description,
# with intra-wiki markdown links flattened. All 178 techniques below are verified.
#
# UNVERIFIED FROM PRIMARY SOURCE: the owasp_asi block. The canonical OWASP page
# (https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)
# returns HTTP 403 to automated fetches. The ASI01-ASI10 names below are corroborated
# by three independent secondary sources that agree on ordering and substance;
# exact wording of ASI02/03/04/08 varies slightly between them. Treat names as
# indicative, IDs and ordering as reliable.
#
# "agentic: true" == the technique's subject is an AI agent, an agent tool / MCP
# server, agent memory or context, or agent configuration. Broader LLM- and RAG-era
# techniques (prompt injection, RAG poisoning, jailbreak) are marked false even though
# they are recent, because their subject is the model rather than the agent.

