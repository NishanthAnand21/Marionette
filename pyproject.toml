[project]
name = "marionette-agentic"
version = "0.2.0"
description = "Executable agentic TTP framework — ATLAS has the techniques, Marionette pulls the strings."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Marionette contributors"}]
dependencies = ["pyyaml>=6.0"]
keywords = [
    "security",
    "adversary-emulation",
    "purple-team",
    "detection-engineering",
    "mitre-atlas",
    "owasp",
    "llm-security",
    "ai-agents",
    "mcp",
    "model-context-protocol",
    "prompt-injection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/marionette-agentic/marionette"
Repository = "https://github.com/marionette-agentic/marionette"
Issues = "https://github.com/marionette-agentic/marionette/issues"
Changelog = "https://github.com/marionette-agentic/marionette/blob/main/CHANGELOG.md"
Documentation = "https://github.com/marionette-agentic/marionette/tree/main/docs"

[project.scripts]
marionette = "marionette.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `techniques` and `reference` are DATA, not importable code — they hold no
# Python at all. They are listed here anyway because `marionette run` resolves its
# default technique directory relative to the installed `marionette` package
# (`marionette/../techniques`), and the ATLAS catalog the validator cross-checks
# against the same way (`marionette/../reference`). Listing them as packages is
# what puts those two directories next to `marionette/` in site-packages, so a
# non-editable `pip install marionette-agentic` gets a working CLI instead of
# "no technique YAML found". Remove them only together with a change to that
# path resolution.
packages = [
    "marionette",
    "marionette.targets",
    "marionette.drift",
    "marionette.range",
    "techniques",
    "reference",
    "rules",
]

[tool.setuptools.package-data]
techniques = ["*.yaml", "*.yml"]
reference = ["*.yaml", "*.yml"]
rules = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Registered so `-m "not slow"` works and an unknown mark stays a real signal.
markers = ["slow: resource/scale tests; deselect with -m 'not slow'"]
