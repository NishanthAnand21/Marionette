id: MARR-0009
title: Elevated authority granted and exercised within one session
status: experimental
level: high
description: >
  A privileged scope was granted mid-session and, in the same session and
  under the same principal, a tool that needs that class of scope ran. The
  legitimate version of this is a human approving an elevation for a task the
  user asked for; the attack version is an injected instruction talking the
  agent through its own approval flow and then spending the result. The rule
  grammar is per-event and stateless, so this is co-occurrence grouped by
  principal, not proven ordering -- confirm the sequence in the raw stream
  before calling it escalation. Stated plainly because a rule that implies
  more precision than it has is worse than one that admits its limit.
detection:
  grant:
    type: agent.authority
    kind: grant
    data.granted|re: '(secret|admin|write|delete|send|\*)'
  exercise:
    type: agent.tool.call
    tool_name:
      - read_secret
      - read_credentials
      - exec_code
      - delete_records
      - http_post
      - send_email
  condition: grant or exercise
  group_by: principal
  min_count: 2
covers: [MAR-0003, MAR-0006, MAR-0008, MAR-0023]
atlas: [AML.T0054, AML.T0053]
owasp: [ASI03, LLM06]
falsepositives:
  - >
    Any just-in-time elevation design fires here every time it works as
    intended. This rule earns its keep only where elevation is supposed to be
    rare; in a JIT-by-default deployment it is pure noise.
  - >
    Because the condition is an OR grouped by principal, two grants with no
    exercise (or two privileged calls with no grant) also reach the threshold.
    Read the matched event ids; do not act on the count alone.
