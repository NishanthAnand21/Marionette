id: MARR-0001
title: Planner acted on an instruction from untrusted content
status: stable
level: high
description: >
  The agent's planner issued a tool invocation whose proximate cause was text
  it read rather than a request the user made. Every indirect prompt injection
  ends here regardless of which channel carried the payload -- a fetched page,
  a retrieved document, a recalled memory, a sub-agent reply, a loaded
  artifact or its own tampered standing instructions -- so this is the single
  highest-value rule in the pack. It keys on provenance, not on payload
  wording, and therefore does not decay as attacker phrasing changes.
detection:
  selection:
    type: agent.delegation
    kind: planner_follow
  trusted:
    provenance: user
  condition: selection and not trusted
covers: [MAR-0001, MAR-0004, MAR-0007, MAR-0009, MAR-0010, MAR-0011,
         MAR-0012, MAR-0014, MAR-0019, MAR-0020, MAR-0021, MAR-0022,
         MAR-0023, MAR-0024, MAR-0025, MAR-0026]
atlas: [AML.T0051.001, AML.T0053]
owasp: [LLM01, ASI01]
falsepositives:
  - >
    Agents designed to be driven by content are legitimately noisy here: a
    "read this ticket and do what it says" workflow, an inbox triage bot, or a
    scripted runbook read from a repo all produce planner_follow events with
    non-user provenance by design. Allowlist the provenance channel the
    workflow depends on rather than lowering the level.
  - >
    A sub-agent architecture where the orchestrator is meant to obey the
    worker's reply will fire on provenance `sub-agent` continuously.
