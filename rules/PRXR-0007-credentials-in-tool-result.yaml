id: PRXR-0007
title: Credential material returned into the model's context
status: stable
level: high
description: >
  A tool result carried something credential-shaped -- an API key, a password
  assignment, a bearer token, a field literally named secret. Once it is in the
  result it is in the context window, which means it is in scope for any later
  summarisation, any memory write, and any outbound tool call. Detecting the
  moment it enters is what makes the subsequent egress explainable.
detection:
  selection:
    type: agent.tool.result
    data.ok: true
    data.content|re:
      - '"secret"\s*:'
      - '(?i)(password|api[_-]?key|access[_-]?token|client[_-]?secret)\s*[=:]'
      - 'sk_live_[A-Za-z0-9]'
      - 'AKIA[0-9A-Z]{16}'
      - '(?i)\b(tok|tkn|key|pat)-[A-Za-z0-9_-]{8,}'
      - '(?i)\bbearer\s+[A-Za-z0-9._-]{16,}'
  condition: selection
covers: [PRX-0003, PRX-0006, PRX-0008, PRX-0015, PRX-0016, PRX-0017, PRX-0023]
atlas: [AML.T0055, AML.T0057]
owasp: [ASI03, LLM02]
falsepositives:
  - >
    Secret-manager and vault tools return credentials because that is what
    they are for; so does a deliberate `read_credentials` call the user made.
    Pair with provenance (PRXR-0005) or with an egress rule before paging.
  - >
    Regex on content is inherently lossy: documentation, test fixtures and
    error messages that merely mention "password:" will match, and a token
    format not listed here will not.
