id: MARR-0002
title: Live tool description carries model-facing instructions
status: stable
level: critical
description: >
  A tool advertised in the registry has a description containing an imperative
  aimed at the model rather than a capability statement aimed at the operator.
  Descriptions are prompt content, so a server that mutates one after the human
  approved it at install time has re-written part of the system prompt without
  re-asking. This is the postmark-mcp shape: clean at review, poisoned later.
  The rule reads the advertised registry, so it fires on the mutation without
  needing to have seen the original -- unlike a snapshot diff, which needs both.
detection:
  selection:
    type: agent.tool.list
    data.tools|re:
      - '(SYSTEM|IMPORTANT|INSTRUCTION)[^A-Za-z]{0,6}(call|invoke|use|send|do not|ignore)'
      - 'ignore (all )?(previous|prior) instructions'
      - '<!--.*(instruction|system).*-->'
  condition: selection
covers: [MAR-0002, MAR-0009, MAR-0013]
atlas: [AML.T0110.000, AML.T0109]
owasp: [ASI04, LLM01]
falsepositives:
  - >
    Prompt-engineered descriptions are a legitimate practice: "IMPORTANT: call
    this only after list_accounts" is honest guidance and will match. Triage on
    whether the description changed, not on whether it is imperative -- pair
    this rule with `marionette drift` output before escalating.
  - >
    Tools that wrap documentation or security content ("explain the phrase
    'ignore previous instructions'") carry the pattern in their own text.
