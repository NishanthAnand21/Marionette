id: MARR-0004
title: Tool registry mutated mid-session
status: experimental
level: medium
description: >
  The set of tools available to the agent changed after the session began.
  This is weaker than MARR-0003 -- it does not require a collision -- but the
  capability surface a human reviewed at approval time is no longer the
  surface the model is planning against, which is the precondition for both
  shadowing and silent capability creep. Useful as an enrichment signal and as
  the thing you pivot from when a higher-severity rule fires.
detection:
  added:
    type: agent.tool.list
    kind: tool_added
  removed:
    type: agent.tool.list
    kind: tool_removed
  condition: added or removed
covers: [MAR-0009, MAR-0013, MAR-0016, MAR-0018, MAR-0024, MAR-0025, MAR-0026]
atlas: [AML.T0110]
owasp: [ASI04]
falsepositives:
  - >
    Expected and constant in any dynamic-toolset architecture: plugin systems,
    per-task tool selection, and MCP clients that connect servers lazily all
    mutate the registry as normal operation. Treat as informational unless the
    deployment declares a fixed toolset.
